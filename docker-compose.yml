# Production-like stack: Postgres + the Legible app.
#   cp .env.example .env   # set LEGIBLE_JWT_SECRET and POSTGRES_PASSWORD at least
#   docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: legible
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: legible
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legible"]
      interval: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      LEGIBLE_DATABASE_URL: postgresql+psycopg://legible:${POSTGRES_PASSWORD}@db:5432/legible
    volumes:
      - appdata:/data
      - ./runs:/models:ro          # trained checkpoints; set LEGIBLE_HTR_CHECKPOINT=/models/...
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: {}
  appdata: {}
