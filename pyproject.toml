[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legible"
version = "0.1.0"
description = "Assistive learning platform: handwriting transcription for dysgraphia, plus adaptive training for dyslexia, dyscalculia, and auditory/nonverbal processing."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "scipy>=1.11",
    "opencv-python-headless>=4.9",
    "pyyaml>=6.0",
    "rapidfuzz>=3.0",
    "fonttools>=4.40",
    "torch>=2.4",
]

[project.optional-dependencies]
train = [
    "tensorboard>=2.15",
    "datasets>=2.18",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "sse-starlette>=2.1",
    "anthropic>=2.1",
    "alembic>=1.13",
    "httpx>=0.27",
]
postgres = ["psycopg[binary]>=3.1"]
export = ["onnx>=1.16", "onnxruntime>=1.18"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
legible-train = "legible.htr.train:main"
legible-eval = "legible.htr.evaluate:main"
legible-transcribe = "legible.htr.inference:main"
legible-prepare = "legible.htr.prepare:main"
legible-export = "legible.htr.export:main"
legible-export-research = "legible.api.research_export:main"
legible-db = "legible.api.migrate:main"
legible-api = "legible.api.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"legible.literacy" = ["data/*.tsv"]
"legible.api.migrations" = ["script.py.mako", "versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
