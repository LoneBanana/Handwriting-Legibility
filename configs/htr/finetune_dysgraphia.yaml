# Stage 2: adapt a pretrained model to strongly irregular (dysgraphic) handwriting.
# Heavier synthetic irregularity and augmentation, any real dysgraphic samples you
# have (e.g. consented corrections exported from the app), and a lower learning rate.
base: large.yaml

data:
  train:
    - {type: synthetic, name: synth_irregular, weight: 2.0, fonts_dir: assets/fonts,
       corpus: data/corpus/sentences.txt, size: 2000000, irregularity: 0.9}
    - {type: manifest, name: iam, weight: 1.0, path: data/iam/train.jsonl}
    # Consented corrections exported from the app (legible-export-research, then legible-prepare split):
    # - {type: manifest, name: dysgraphia, weight: 2.0, path: data/consented/train.jsonl}
  augment:
    strength: 0.85
    p_elastic: 0.7
    p_baseline_warp: 0.7
    p_horizontal_jitter: 0.7

train:
  output_dir: runs/htr-large-dysgraphia
  init_from: runs/htr-large/best.pt
  resume: auto
  max_steps: 40000
  lr: 2.0e-4
  min_lr: 1.0e-5
  warmup_steps: 1000
